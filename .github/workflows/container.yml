name: container

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: build-and-push
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable container emulation
        run: |
          set -euo pipefail
          docker run --privileged --rm tonistiigi/binfmt --install arm64

      - name: Set up Docker Buildx
        run: |
          set -euo pipefail
          docker buildx create --name rscale-builder --driver docker-container --use
          docker buildx inspect --bootstrap

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io \
            --username "${GITHUB_ACTOR}" \
            --password-stdin

      - name: Docker metadata
        id: meta
        run: |
          set -euo pipefail

          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          short_sha="${GITHUB_SHA::12}"
          tags="${image}:sha-${short_sha}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tags="${image}:${GITHUB_REF_NAME},${tags}"
          fi

          labels=$(cat <<LABELS
          org.opencontainers.image.title=rscale
          org.opencontainers.image.description=Self-hosted Rust control plane for operating a single tailnet with Tailscale clients
          org.opencontainers.image.licenses=Apache-2.0
          org.opencontainers.image.vendor=${GITHUB_REPOSITORY_OWNER}
          org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}
          org.opencontainers.image.revision=${GITHUB_SHA}
          LABELS
          )

          {
            printf 'image=%s\n' "${image}"
            printf 'tags=%s\n' "${tags}"
            printf 'labels<<EOF\n%s\nEOF\n' "${labels}"
          } >>"${GITHUB_OUTPUT}"

      - name: Build and push image
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
          LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          set -euo pipefail

          build_args=(
            --file ./Dockerfile
            --platform linux/amd64,linux/arm64
            --push
            --provenance=false
            --sbom=false
            --cache-from "type=registry,ref=${IMAGE}:buildcache"
            --cache-to "type=registry,ref=${IMAGE}:buildcache,mode=max"
          )

          IFS=',' read -ra tag_values <<<"${TAGS}"
          for tag in "${tag_values[@]}"; do
            build_args+=(--tag "${tag}")
          done

          while IFS= read -r label; do
            [[ -z "${label}" ]] || build_args+=(--label "${label}")
          done <<<"${LABELS}"

          docker buildx build "${build_args[@]}" .
